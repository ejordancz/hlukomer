services:
  hlukomer:
    build: ./backend
    container_name: hlukomer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      INGEST_API_KEY: ${INGEST_API_KEY:-changeme}
      ALERT_DAY_DBA: ${ALERT_DAY_DBA:-45}
      ALERT_NIGHT_DBA: ${ALERT_NIGHT_DBA:-40}
      ALERT_DAY_START_HOUR: ${ALERT_DAY_START_HOUR:-6}
      ALERT_DAY_END_HOUR: ${ALERT_DAY_END_HOUR:-22}
      DISPLAY_WINDOW_CORRECTION_DB: ${DISPLAY_WINDOW_CORRECTION_DB:-3}
      DISPLAY_TONAL_PENALTY_DB: ${DISPLAY_TONAL_PENALTY_DB:-5}
      APP_ENV: ${APP_ENV:-DEV}
      TZ: ${TZ:-Europe/Prague}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      HOT_RETENTION_HOURS: ${HOT_RETENTION_HOURS:-48}
      ARCHIVE_INTERVAL_S: ${ARCHIVE_INTERVAL_S:-5}
      ARCHIVE_JOB_INTERVAL_S: ${ARCHIVE_JOB_INTERVAL_S:-300}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD musí být v .env}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-0}
      LATITUDE: ${LATITUDE:-}
      LONGITUDE: ${LONGITUDE:-}
      YR_USER_AGENT: ${YR_USER_AGENT:-hlukomer/1.0 (local)}
      AIRCRAFT_ENABLED: ${AIRCRAFT_ENABLED:-}
      AIRCRAFT_SHOW_UI: ${AIRCRAFT_SHOW_UI:-1}
      AIRCRAFT_MAX_ALTITUDE_M: ${AIRCRAFT_MAX_ALTITUDE_M:-1500}
      AIRCRAFT_MAX_DISTANCE_KM: ${AIRCRAFT_MAX_DISTANCE_KM:-8}
      AIRCRAFT_POLL_INTERVAL_S: ${AIRCRAFT_POLL_INTERVAL_S:-60}
      AIRCRAFT_GAP_S: ${AIRCRAFT_GAP_S:-180}
      AIRCRAFT_RETENTION_DAYS: ${AIRCRAFT_RETENTION_DAYS:-}
      AIRCRAFT_BBOX_PADDING_KM: ${AIRCRAFT_BBOX_PADDING_KM:-}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      DATA_DIR: /data
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

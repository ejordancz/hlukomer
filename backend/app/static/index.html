<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hlukoměr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <p class="brand-name">Hlukoměr</p>
        <p class="brand-sub">24/7 monitoring u okna</p>
      </div>
    </div>
    <div class="status" id="status">
      <span class="dot" id="onlineDot"></span>
      <span id="onlineLabel">připojuji…</span>
    </div>
  </header>

  <main>
    <section class="hero-level" aria-live="polite">
      <p class="label">Aktuální LAeq (1 s)</p>
      <p class="level" id="liveLevel">—.—</p>
      <p class="unit">dBA</p>
      <p class="meta" id="liveMeta">čekám na data z ESP32…</p>
    </section>

    <section class="controls">
      <label>
        Rozsah
        <select id="rangeSelect">
          <option value="1">1 hodina</option>
          <option value="6">6 hodin</option>
          <option value="24" selected>24 hodin</option>
          <option value="168">7 dní</option>
          <option value="720">30 dní</option>
        </select>
      </label>
      <label>
        Metrika
        <select id="metricSelect">
          <option value="laeq_1s">LAeq 1s (živě)</option>
          <option value="laeq_1min" selected>LAeq 1min</option>
          <option value="lamax_1min">LAmax 1min</option>
          <option value="lamin_1min">LAmin 1min</option>
        </select>
      </label>
    </section>

    <section class="chart-wrap">
      <canvas id="chart" height="120"></canvas>
    </section>

    <section class="stats" id="stats">
      <div class="stat">
        <span class="stat-label">Průměr</span>
        <span class="stat-value" id="statAvg">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Minimum</span>
        <span class="stat-value" id="statMin">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Maximum</span>
        <span class="stat-value" id="statMax">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Nad limitem</span>
        <span class="stat-value" id="statAbove">—</span>
      </div>
    </section>

    <section class="minute">
      <h2>Poslední minuta</h2>
      <div class="minute-grid">
        <div><span>LAeq</span><strong id="mLaeq">—</strong></div>
        <div><span>LAmax</span><strong id="mLamax">—</strong></div>
        <div><span>LAmin</span><strong id="mLamin">—</strong></div>
        <div><span>Limit</span><strong id="mLimit">—</strong></div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>

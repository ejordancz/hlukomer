# Hlukoměr — ESP32-S3 + Adafruit ICS-43434
# Flash: esphome run esphome/hlukomer.yaml
# Secrets: esphome/secrets.yaml (viz secrets.yaml.example)
# Spektrum: 1/3-oktáva 25–250 Hz + oktávy 500 Hz–16 kHz; LZeq; LFI 20–200 Hz
# High-res FFT 170–270 + 25–70 Hz: Goertzel DFT 1 Hz (decim 48→4 kHz) → POST kind=spectrum_fine / 3 s

substitutions:
  device_name: hlukomer
  # IP/hostname Docker služby (stejná LAN jako ESP)
  api_base_url: "http://192.168.1.214:8080"
  # Po kalibraci: kladný = reportuje vyšší dB (viz CALIBRATION.md)
  calibration_offset: "-2.4dB"

esphome:
  name: ${device_name}
  friendly_name: Hlukoměr

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

# A-vážení, LAeq/LZeq, LFI, 1/3-oktáva + oktávové spektrum; high-res FFT 170–270 + 25–70
external_components:
  - source: github://stas-sl/esphome-sound-level-meter@dev
    components: [sound_level_meter]
  # Hassio nemá /config/esphome/components — ber z GitHubu (refresh: 0s = vždy aktuální).
  - source: github://ejordancz/hlukomer@main
    components: [hlukomer_fine_fft]
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Při vysokém noise floor zkus 8.5dB (méně RF šumu)
  output_power: 15dB
  ap:
    ssid: "Hlukomer Fallback"
    password: !secret ap_password

captive_portal:

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

http_request:
  useragent: hlukomer/1.0
  timeout: 5s
  verify_ssl: false

i2s_audio:
  - id: i2s_in
    i2s_bclk_pin: GPIO4
    i2s_lrclk_pin: GPIO5

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_in
    adc_type: external
    i2s_din_pin: GPIO6
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    channel: left
    i2s_mode: primary

# High-res FFT 170–270 + 25–70 Hz (Goertzel ≡ FFT bins @ 1 Hz, decim 4 kHz), POST každých 3 s
hlukomer_fine_fft:
  microphone: mic
  api_url: ${api_base_url}/api/v1/ingest
  api_key: !secret ingest_api_key
  device_id: ${device_name}
  # Doladit podle referenčního tónu / LZeq (dB SPL offset)
  spl_offset: 94.0
  bits_per_sample: 32

# ICS-43434 datasheet: −26 dBFS @ 94 dB SPL
sound_level_meter:
  id: slm
  microphone:
    microphone: mic
    bits_per_sample: 32
  update_interval: 60s
  auto_start: true
  warmup_interval: 500ms
  use_esp_dsp: true
  task_stack_size: 16384
  mic_sensitivity: -26dB
  mic_sensitivity_ref: 94dB
  offset: ${calibration_offset}

  dsp_filters:
    - id: f_ics43434
      type: sos
      coeffs:
        - [0.47732642, 0.46294358, 0.11224797, 0.06681948, 0.00111522]
        - [1.0, -1.9890593, 0.98908925, -1.9975533, 0.99755484]
    - id: f_a
      type: sos
      coeffs:
        - [0.16999495, 0.741029, 0.52548885, -0.11321865, -0.056549273]
        - [1.0, -2.00027, 1.0002706, -0.03433284, -0.79215795]
        - [1.0, -0.709303, -0.29071867, -1.9822421, 0.9822986]
    # LFI bandpass 20–200 Hz (přímý Low Frequency Index)
    - id: f_lfi
      type: sos
      coeffs:
        # bandpass 20-200 Hz order4 @ 48 kHz
        - [1.868249022152213e-08, 3.736498044304426e-08, 1.868249022152213e-08, -1.962224006652832, 0.9626878499984741]
        - [1.0, 2.0, 1.0, -1.9831511974334717, 0.9838031530380249]
        - [1.0, -2.0, 1.0, -1.994491696357727, 0.9945015907287598]
        - [1.0, -2.0, 1.0, -1.9982913732528687, 0.9982985258102417]
    # 1/3-oktáva 25.0 Hz (22.3–28.1 Hz)
    - id: f_band_25
      type: sos
      coeffs:
        # third fc=25.0 order=4 @ 48 kHz
        - [2.058940583131441e-14, 4.117881166262882e-14, 2.058940583131441e-14, -1.9992573261260986, 0.9992690086364746]
        - [1.0, 2.0, 1.0, -1.999321460723877, 0.9993312954902649]

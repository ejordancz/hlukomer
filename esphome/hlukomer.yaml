      name: LAeq 1s
      id: laeq_1s
      unit_of_measurement: dBA
      accuracy_decimals: 1
      update_interval: 1s
      dsp_filters: [f_ics43434, f_a]
      on_value:
        then:
          - http_request.post:
              url: ${api_base_url}/api/v1/ingest
              request_headers:
                Content-Type: application/json
                X-Api-Key: !secret ingest_api_key
              json: |-
                root["device_id"] = "${device_name}";
                root["kind"] = "live";
                root["laeq_1s"] = x;
                root["lez_1s"] = id(lez_1s).state;
                root["lfi_db"] = id(lfi_db).state;
                root["spectrum"][0] = id(oct_25).state;
                root["spectrum"][1] = id(oct_31).state;
                root["spectrum"][2] = id(oct_40).state;
                root["spectrum"][3] = id(oct_50).state;
                root["spectrum"][4] = id(oct_63).state;
                root["spectrum"][5] = id(oct_80).state;

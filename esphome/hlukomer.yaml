      id: lez_1s
      unit_of_measurement: dB
      accuracy_decimals: 1
      update_interval: 1s
      dsp_filters: [f_ics43434]

    - type: eq
      name: LFI 20-200 Hz
      id: lfi_db
      unit_of_measurement: dB
      accuracy_decimals: 1
      update_interval: 1s
      dsp_filters: [f_ics43434, f_lfi]

    - type: eq
      name: LAeq 1min
      id: laeq_1min
      unit_of_measurement: dBA
      accuracy_decimals: 1
      update_interval: 60s
      dsp_filters: [f_ics43434, f_a]
      on_value:
        then:
          - delay: 200ms
          - http_request.post:
              url: ${api_base_url}/api/v1/ingest
              request_headers:
                Content-Type: application/json
                X-Api-Key: !secret ingest_api_key
              json: |-
                root["device_id"] = "${device_name}";
                root["kind"] = "minute";
                root["laeq_1min"] = id(laeq_1min).state;
                root["lamax_1min"] = id(lamax_1min).state;
                root["lamin_1min"] = id(lamin_1min).state;

    - type: max
      name: LAmax 1s/1min
      id: lamax_1min
      window_size: 1s
      unit_of_measurement: dBA
      accuracy_decimals: 1
      update_interval: 60s
      dsp_filters: [f_ics43434, f_a]

    - type: min
      name: LAmin 1s/1min
      id: lamin_1min
      window_size: 1s
      unit_of_measurement: dBA
      accuracy_decimals: 1
      update_interval: 60s
      dsp_filters: [f_ics43434, f_a]

    # Spektrum: 1/3-oktáva 25–250 Hz + oktávy 500 Hz–16 kHz (bez A-vážení)
    - type: eq
      name: 25 Hz
      id: oct_25
      unit_of_measurement: dB
      accuracy_decimals: 1
      update_interval: 1s
      dsp_filters: [f_ics43434, f_band_25]
    - type: eq
      name: 31.5 Hz
      id: oct_31
      unit_of_measurement: dB
